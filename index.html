cat <<EOF > index.html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <title>AI Hub</title>
    <style>

        h2 { margin: 0; font-size: 18px; color: #38bdf8; }
        p { margin: 5px 0; font-size: 13px; color: #cbd5e1; }
        .btn { display: block; background: #38bdf8; color: #0f172a; padding: 8px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>AI Hub</h1>

        <img src="gemini.png" class="icon">

        <img src="chatgpt.png" class="icon">
        <div class="content">

            <a href="https://chatgpt.com" class="btn">فتح</a>

    <div class="card">
        <img src="deepseek.png" class="icon">

    <div class="card">
        <img src="claude.png" class="icon">
        <div class="content">
            <h2>Claude</h2>
