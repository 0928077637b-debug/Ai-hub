<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub - المركز الذكي</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; text-align: center; }
        
        /* شاشة التحميل */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 5px solid #334155; border-top: 5px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* التصميم */
        .container { max-width: 500px; margin: auto; }
        h1 { color: var(--accent); font-size: 28px; margin-bottom: 25px; }
        .card { background: var(--card); border-radius: 16px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; border: 1px solid #334155; }
        .icon-box { width: 50px; height: 50px; background: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 5px; }
        .icon-box svg, .icon-box img { width: 40px; height: 40px; }
        .content { flex: 1; text-align: right; }
        h2 { margin: 0; font-size: 17px; color: var(--accent); }
        .btn { display: block; background: var(--accent); color: #0f172a; padding: 8px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 8px; text-align: center; }

        .support-box { margin-top: 30px; padding: 15px; border: 2px dashed #334155; border-radius: 12px; }
        .support-btn { background: #ef4444; color: white; padding: 10px; border-radius: 8px; text-decoration: none; display: block; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div><h2 style="color:var(--accent)">AI HUB</h2></div>

    <div class="container">
        <h1>⚡ AI Hub</h1>

        <div class="card">
            <div class="icon-box">
                <img src="https://www.gstatic.com/lamda/images/favicon_v1_150160c13ff21d30f1d3.png" alt="G">
            </div>
            <div class="content">
                <h2>Google Gemini</h2>
                <a href="https://gemini.google.com" class="btn">دخول</a>
            </div>
        </div>

        <div class="card">
            <div class="icon-box">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg" alt="C">
            </div>
            <div class="content">
                <h2>OpenAI ChatGPT</h2>
                <a href="https://chatgpt.com" class="btn">دخول</a>
            </div>
        </div>

        <div class="card">
            <div class="icon-box" style="background:#d97757">
                <img src="https://claude.ai/images/apple-touch-icon.png" alt="Cl">
            </div>
            <div class="content">
                <h2>Anthropic Claude</h2>
                <a href="https://claude.ai" class="btn">دخول</a>
            </div>
        </div>

        <div class="card">
            <div class="icon-box" style="background:#000">
                <img src="https://www.deepseek.com/favicon.ico" alt="D">
            </div>
            <div class="content">
                <h2>DeepSeek</h2>
                <a href="https://www.deepseek.com/" class="btn">دخول</a>
            </div>
        </div>

        <div class="support-box">
            <h3>🛠️ الدعم الفني</h3>
            <a href="mailto:AiHubsupert@Gmail.com?subject=مشكلة في تطبيق AI Hub" class="support-btn">إرسال رسالة دعم</a>
        </div>
    </div>

    <script>
        window.onload = function() {
            setTimeout(function() {
                document.getElementById('loader').style.display = 'none';
            }, 1000);
        };
    </script>
</body>
</html>
