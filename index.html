<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub - المركز الذكي</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; text-align: center; }
        
        /* شاشة التحميل الاحترافية */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s; }
        .spinner { width: 60px; height: 60px; border: 6px solid #334155; border-top: 6px solid var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* التصميم */
        .container { max-width: 500px; margin: auto; }
        h1 { color: var(--accent); font-size: 32px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .card { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        /* حل مشكلة الصور: حجم ثابت وخلفية بيضاء للأيقونات */
        .icon-box { width: 60px; height: 60px; min-width: 60px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 5px; }
        .icon-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .content { flex: 1; text-align: right; }
        h2 { margin: 0; font-size: 18px; color: var(--accent); }
        p { margin: 5px 0; font-size: 13px; color: #cbd5e1; line-height: 1.4; }
        .btn { display: inline-block; background: var(--accent); color: #0f172a; padding: 10px 25px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 10px; width: 100%; box-sizing: border-box; }

        /* الدعم */
        .support-box { margin-top: 40px; padding: 20px; border: 2px dashed #334155; border-radius: 15px; }
        .support-btn { background: #ef4444; color: white; padding: 12px; border-radius: 10px; text-decoration: none; display: block; margin-top: 15px; font-weight: bold; }
        
        footer { margin-top: 40px; color: #64748b; font-size: 12px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h2 style="color: var(--accent); margin-top: 20px;">AI HUB</h2>
    </div>

    <div class="container">
        <h1>⚡ AI Hub</h1>

        <div class="card">
            <div class="icon-box">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/45/Gemini_language_model_logo.svg" alt="Gemini">
            </div>
            <div class="content">
                <h2>Google Gemini</h2>
                <p>مساعد جوجل الذكي للبحث والإبداع.</p>
                <a href="https://gemini.google.com" class="btn">دخول</a>
            </div>
        </div>

        <div class="card">
            <div class="icon-box">
                <img src="https://static-00.iconduck.com/assets.00/chatgpt-icon-1024x1024-v58ls9lh.png" alt="ChatGPT">
            </div>
            <div class="content">
                <h2>OpenAI ChatGPT</h2>
                <p>أقوى نموذج لغوي للمحادثة والكتابة.</p>
                <a href="https://chatgpt.com" class="btn">دخول</a>
            </div>
        </div>

        <div class="card">
            <div class="icon-box" style="background: #000;">
                <img src="https://www.deepseek.com/favicon.ico" alt="DeepSeek">
            </div>
            <div class="content">
                <h2>DeepSeek</h2>
                <p>خبير البرمجة والمنطق والذكاء العميق.</p>
                <a href="https://www.deepseek.com/" class="btn">دخول</a>
            </div>
        </div>

        <div class="support-box">
            <h3>🛠️ مركز الدعم الفني</h3>
            <p>تواجه مشكلة؟ أرسل شكوتك فوراً.</p>
            <a href="mailto:AiHubsupert@Gmail.com?subject=مشكلة في تطبيق AI Hub" class="support-btn">إرسال رسالة دعم</a>
        </div>

        <footer>
            <p>© 2026 جميع الحقوق محفوظة لـ AI Hub</p>
        </footer>
    </div>

    <script>
        // كود تشغيل وإخفاء الشاشة بدقة
        window.onload = function() {
            setTimeout(function() {
                var loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(function() {
                    loader.style.display = 'none';
                }, 500);
            }, 1000); // الشاشة تظهر لمدة ثانية واحدة
        };
    </script>
</body>
</html>
